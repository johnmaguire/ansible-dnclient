---
# Internal variables. User-facing knobs live in defaults/main.yml.

dnclient_root_group: "{{ 'wheel' if ansible_os_family == 'Darwin' else 'root' }}"
dnclient_inactive_track: "{{ 'unstable' if dnclient_track == 'stable' else 'stable' }}"

# Debian/Ubuntu install from the apt repository, RHEL/Fedora from the rpm
# repository, Arch from the AUR, Windows from the downloads API MSI.
# Platforms without a package (macOS) download the binary from the
# downloads API.
dnclient_install_method: >-
  {{ {'Debian': 'apt',
      'RedHat': 'rpm',
      'Archlinux': 'aur',
      'Windows': 'msi'}.get(ansible_os_family, 'binary') }}

# The apt/rpm/aur packages install to /usr/bin; the MSI to its Program Files
# tree; the downloaded binary (macOS) lives in dnclient_install_dir.
#
# A custom build shadows the packaged binary on PATH, so anything the role runs
# directly (enrollment, service control) should be the custom build too. The
# binary install method copies it into dnclient_install_dir instead, so the
# default path already points at it there.
dnclient_bin: >-
  {{ dnclient_custom_bin
     if dnclient_custom_binary is defined and dnclient_install_method != 'binary'
     else {'apt': '/usr/bin/dnclient',
           'rpm': '/usr/bin/dnclient',
           'aur': '/usr/bin/dnclient',
           'msi': dnclient_win_dir ~ '\dnclient.exe'}.get(dnclient_install_method, dnclient_install_dir ~ '/dnclient') }}

# Names the platform's download from the downloads API, and available for
# templating a per-platform dnclient_custom_binary path on the controller.
dnclient_arch_map:
  x86_64: amd64
  aarch64: arm64
  arm64: arm64
  # Windows facts report a friendly name rather than the machine type.
  '64-bit': amd64
dnclient_os_map:
  FreeBSD: freebsd
  Darwin: macos
  Windows: windows
dnclient_os: "{{ dnclient_os_map[ansible_os_family] | default('linux') }}"
dnclient_arch: "{{ dnclient_arch_map[ansible_architecture] }}"
# macOS ships a single universal binary, so it has no per-arch download key.
dnclient_download_key: "{{ 'macos-universal-server' if dnclient_os == 'macos' else dnclient_os ~ '-' ~ dnclient_arch }}"

# Explicit values win; otherwise fall back to the first network visible to the
# API key. v2 networks are dual-stack capable: cidrs lists every CIDR (IPv4
# and, when enabled, IPv6).
dn_network_id: "{{ dnclient_network_id | default(dn_network_results.json.data[0].id) }}"
dn_network_cidrs: "{{ dnclient_network_cidrs | default(dn_network_results.json.data[0].cidrs) }}"
