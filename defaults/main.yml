---
# defaults file for dnclient
dnclient_install_dir: "/opt/defined"
# Unprivileged user the AUR build runs as on Arch. Must exist, have yay
# installed, and be able to run pacman via passwordless sudo.
dnclient_aur_builder_user: "builduser"
# Where a custom build pushed via dnclient_custom_binary lands. Ahead of
# /usr/bin on PATH, so it shadows the packaged binary for interactive use too.
dnclient_custom_bin: "/usr/local/bin/dnclient"
dnclient_firewall_exception: false
dnclient_enroll: false
# Windows MSI flavor from the downloads API: "server" (headless service) or
# "desktop" (tray UI).
dnclient_windows_variant: "server"
# The MSI's install tree. Enrollment state lives under config\ inside it, not
# ProgramData.
dnclient_win_dir: 'C:\Program Files\Defined Networking\DNClient'
# Release track to follow: "stable" or "unstable" (pre-release builds).
# The unstable repositories are a superset of stable, so only one is ever
# enabled at a time.
dnclient_track: "stable"
