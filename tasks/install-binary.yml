---
# Download the dnclient binary from the downloads API and install the service
# manually. Used on platforms without a Defined Networking package (Arch, macOS).
- name: Create directory for binary
  file:
    path: "{{ dnclient_install_dir }}"
    state: directory
    owner: root
    group: "{{ root_group }}"
    mode: '1755'

- name: Determine latest dnclient release
  block:
    - name: Fetch dnclient release information
      uri:
        url: https://api.defined.net/v1/downloads
        headers:
          Authorization: "Bearer {{ dnclient_api_key | default(omit) }}"
        return_content: yes
      register: dnclient_downloads

    - set_fact:
        dnclient_arch_map:
          x86_64: amd64
          aarch64: arm64
          arm64: arm64
        dnclient_os_map:
          FreeBSD: freebsd
          Darwin: macos
          Windows: windows
    - set_fact:
        dnclient_os: "{{ dnclient_os_map[ansible_os_family] | default('linux') }}"
        dnclient_arch: "{{ dnclient_arch_map[ansible_architecture] }}"

    - set_fact:
        dnclient_download_key: "{{ (dnclient_os == 'macos') | ternary('macos-universal-server', dnclient_os ~ '-' ~ dnclient_arch) }}"

    - set_fact:
        dnclient_latest_url: "{{ dnclient_downloads.json.data.dnclient.latest[dnclient_download_key] }}"

      when: dnclient_latest_url is not defined

- name: Download latest dnclient
  get_url:
    url: "{{ dnclient_latest_url }}"
    dest: "{{ dnclient_install_dir }}/dnclient"
    mode: '0755'
    force: yes
  notify: restart dnclient

- name: Populate service facts
  service_facts:
  when: ansible_os_family != "Darwin"

- name: Install dnclient service (Linux)
  shell:
    cmd: "{{ dnclient_install_dir }}/dnclient install && {{ dnclient_install_dir }}/dnclient start"
  when:
    - ansible_os_family != "Darwin"
    - "'dnclient.service' not in ansible_facts.services"

- name: Install dnclient service (macOS)
  shell:
    cmd: "{{ dnclient_install_dir }}/dnclient install && {{ dnclient_install_dir }}/dnclient start"
  args:
    creates: /Library/LaunchDaemons/dnclient.plist
  when: ansible_os_family == "Darwin"

- name: Ensure dnclient is running (Linux)
  ansible.builtin.service:
    name: dnclient
    state: started
  when: ansible_os_family != "Darwin"

- name: Ensure dnclient is running (macOS)
  community.general.launchd:
    name: dnclient
    state: started
  when: ansible_os_family == "Darwin"
