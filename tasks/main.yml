---
- name: Set dnclient install facts
  set_fact:
    root_group: "{{ 'wheel' if ansible_os_family == 'Darwin' else 'root' }}"
    # Debian/Ubuntu install from the apt repository, RHEL/Fedora from the rpm
    # repository. Platforms without a package (Arch, macOS) download the binary
    # from the downloads API.
    dnclient_install_method: "{{ 'apt' if ansible_os_family == 'Debian' else ('rpm' if ansible_os_family == 'RedHat' else 'binary') }}"

- name: Set dnclient binary path
  set_fact:
    # The apt/rpm packages install to /usr/bin; the downloaded binary lives in
    # dnclient_install_dir.
    dnclient_bin: "{{ '/usr/bin/dnclient' if dnclient_install_method in ['apt', 'rpm'] else dnclient_install_dir ~ '/dnclient' }}"

- name: Install dnclient from the apt repository (Debian/Ubuntu)
  include_tasks: install-apt.yml
  when: dnclient_install_method == 'apt'

- name: Install dnclient from the rpm repository (RHEL/Fedora)
  include_tasks: install-rpm.yml
  when: dnclient_install_method == 'rpm'

- name: Install dnclient from the downloads API (Arch, macOS)
  include_tasks: install-binary.yml
  when: dnclient_install_method == 'binary'

- name: Fetch network information
  uri:
    url: https://api.defined.net/v1/networks
    method: GET
    headers:
      Authorization: "Bearer {{ dnclient_api_key }}"
  register: dn_network_results
  when: dnclient_api_key is defined and (dnclient_enroll or dnclient_firewall_exception)

- name: Populate network facts
  set_fact:
    dn_network_id: "{{ dnclient_network_id | default(dn_network.id) }}"
    dn_network_cidr: "{{ dnclient_network_cidr | default(dn_network.cidr) }}"
  vars:
    dn_network: "{{ dn_network_results.json.data[0] }}"
  when: dn_network_results.json is defined

- name: Check if dnclient is enrolled
  # The apt package stores network state in /var/lib/defined; older binary
  # installs use the legacy /etc/defined. Treat the host as enrolled if a
  # config exists in either location.
  stat:
    path: "{{ item }}"
  loop:
    - /var/lib/defined/dnclient.yml
    - /etc/defined/dnclient.yml
  register: dnclient_config_stat
  when: dnclient_enroll

- name: Determine enrollment status
  set_fact:
    dnclient_enrolled: "{{ dnclient_config_stat.results | selectattr('stat.exists') | list | length > 0 }}"
  when: dnclient_enroll

- name: Create and enroll host in DN inventory
  block:
    - name: Ensure dnclient service is started
      block:
        - debug: msg="triggering dnclient restart"
          notify: restart dnclient
          changed_when: true
        - meta: flush_handlers

    # TODO handle ERR_DUPLICATE_VALUE - maybe we should re-enroll?
    - name: Create host in DN inventory
      uri:
        url: https://api.defined.net/v1/host-and-enrollment-code
        method: POST
        headers:
          Authorization: "Bearer {{ dnclient_api_key }}"
        body_format: json
        body: "{{ enrollment_payload }}"
      vars:
        enrollment_payload: |
          {
            "name": {{ dnclient_hostname | default(inventory_hostname) | to_json }},
            "networkID": {{ dn_network_id | to_json }},
            "roleID": {{ dnclient_role_id | default(None) | to_json  }},
            "ipAddress": {{ dnclient_ip_address | default(None) | to_json }},
            "staticAddresses": {{ dnclient_static_addresses | default([]) | to_json }},
            "listenPort": {{ dnclient_listen_port | default(0) | to_json }},
            "isLighthouse": {{ dnclient_is_lighthouse | default(false) | to_json }},
            "isRelay": {{ dnclient_is_relay | default(false) | to_json }},
            "tags": {{ dnclient_tags | default([]) | to_json }}
          }
      register: dn_host_results

    - name: Enroll host using enrollment code
      command:
        cmd: "{{ dnclient_bin }} enroll -code {{ dn_host_results.json.data.enrollmentCode.code }}"
  when: dnclient_enroll and not (dnclient_enrolled | default(false))

- name: Add a firewall exception for dnclient network
  block:
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Add an exception for dnclient network CIDR in ufw
      community.general.ufw:
        rule: allow
        src: "{{ dn_network_cidr }}"
      when: "'ufw' in ansible_facts.packages and dn_network_cidr is defined"
  when: dnclient_firewall_exception
