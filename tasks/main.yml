---
- name: Validate the requested release track
  ansible.builtin.assert:
    that: dnclient_track in ['stable', 'unstable']
    fail_msg: "dnclient_track must be 'stable' or 'unstable', got '{{ dnclient_track }}'"
    quiet: true

- name: Fail when a custom binary is requested on Windows
  ansible.builtin.fail:
    msg: dnclient_custom_binary is not supported on Windows hosts.
  when:
    - ansible_os_family == 'Windows'
    - dnclient_custom_binary is defined

# Runs ahead of the install methods below: on a host with no dnclient yet, the
# macOS service install needs the binary already staged.
- name: Manage the custom dnclient binary
  ansible.builtin.include_tasks: custom-binary.yml
  when: ansible_os_family != 'Windows'

- name: Install dnclient from the apt repository (Debian/Ubuntu)
  ansible.builtin.include_tasks: install-apt.yml
  when: dnclient_install_method == 'apt'

- name: Install dnclient from the rpm repository (RHEL/Fedora)
  ansible.builtin.include_tasks: install-rpm.yml
  when: dnclient_install_method == 'rpm'

- name: Install dnclient from the AUR (Arch)
  ansible.builtin.include_tasks: install-aur.yml
  when: dnclient_install_method == 'aur'

- name: Install dnclient from the downloads API (macOS)
  ansible.builtin.include_tasks: install-binary.yml
  when: dnclient_install_method == 'binary'

- name: Install dnclient from the downloads API MSI (Windows)
  ansible.builtin.include_tasks: install-msi.yml
  when: dnclient_install_method == 'msi'

# DN API calls run from the controller: the API key never transits managed
# hosts, and the tasks work unchanged on platforms without a Python runtime
# (Windows). become is disabled so delegation doesn't try to sudo locally.
- name: Fetch network information
  ansible.builtin.uri:
    url: https://api.defined.net/v2/networks
    headers:
      Authorization: "Bearer {{ dnclient_api_key }}"
  register: dn_network_results
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - dnclient_api_key is defined
    - dnclient_enroll or dnclient_firewall_exception

# The apt/rpm/aur packages store network state in /var/lib/defined; older
# binary installs use the legacy /etc/defined. Treat the host as enrolled if
# a config exists in either location.
- name: Check if dnclient is enrolled
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /var/lib/defined/dnclient.yml
    - /etc/defined/dnclient.yml
  register: dnclient_config_stat
  when: dnclient_enroll and ansible_os_family != 'Windows'

- name: Check if dnclient is enrolled (Windows)
  ansible.windows.win_stat:
    path: "{{ dnclient_win_dir }}\\config\\dnclient.yml"
  register: dnclient_config_stat_win
  when: dnclient_enroll and ansible_os_family == 'Windows'

- name: Determine enrollment status
  ansible.builtin.set_fact:
    dnclient_enrolled: "{{ (dnclient_config_stat_win.stat.exists | default(false)) if ansible_os_family == 'Windows' else (dnclient_config_stat.results | selectattr('stat.exists') | list | length > 0) }}"
  when: dnclient_enroll

- name: Create and enroll host in DN inventory
  when: dnclient_enroll and not (dnclient_enrolled | default(false))
  block:
    # Enrollment talks to the running daemon, so restart it first to make sure
    # it is up and running the intended binary.
    - name: Trigger dnclient restart
      ansible.builtin.debug:
        msg: Restarting dnclient before enrollment
      changed_when: true
      notify: restart dnclient

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    # TODO handle ERR_DUPLICATE_VALUE - maybe we should re-enroll?
    # v1 rejects hosts on v2 networks with ERR_CERT_VERSION_2_INCOMPATIBLE.
    # v2 replaces the singular ipAddress with an ipAddresses list (max 2, one
    # per family). On a dual-stack network an IPv4 address is only assigned if
    # one is requested - sending the v1 field silently yields an IPv6-only host.
    - name: Create host in DN inventory
      ansible.builtin.uri:
        url: https://api.defined.net/v2/host-and-enrollment-code
        method: POST
        headers:
          Authorization: "Bearer {{ dnclient_api_key }}"
        body_format: json
        body: "{{ enrollment_payload }}"
      vars:
        # Rendered as a JSON document rather than a YAML mapping so that the
        # null, false and 0 defaults keep their JSON types.
        enrollment_payload: |
          {
            "name": {{ dnclient_hostname | default(inventory_hostname) | to_json }},
            "networkID": {{ dn_network_id | to_json }},
            "roleID": {{ dnclient_role_id | default(None) | to_json }},
            "ipAddresses": {{ dnclient_ip_addresses | default([dnclient_ip_address] if dnclient_ip_address is defined else []) | to_json }},
            "staticAddresses": {{ dnclient_static_addresses | default([]) | to_json }},
            "listenPort": {{ dnclient_listen_port | default(0) | to_json }},
            "isLighthouse": {{ dnclient_is_lighthouse | default(false) | to_json }},
            "isRelay": {{ dnclient_is_relay | default(false) | to_json }},
            "tags": {{ dnclient_tags | default([]) | to_json }}
          }
      register: dn_host_results
      delegate_to: localhost
      become: false
      no_log: true

    - name: Enroll host using enrollment code
      ansible.builtin.command:
        cmd: "{{ dnclient_bin }} enroll -code {{ dn_host_results.json.data.enrollmentCode.code }}"
      no_log: true
      when: ansible_os_family != 'Windows'

    - name: Enroll host using enrollment code (Windows)
      ansible.windows.win_command:
        argv:
          - "{{ dnclient_bin }}"
          - enroll
          - -code
          - "{{ dn_host_results.json.data.enrollmentCode.code }}"
      no_log: true
      when: ansible_os_family == 'Windows'

- name: Add a firewall exception for dnclient network
  when: dnclient_firewall_exception and ansible_os_family != 'Windows'
  block:
    - name: Gather the package facts
      ansible.builtin.package_facts:

    - name: Allow traffic from dnclient network CIDRs in ufw
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
      loop: "{{ dn_network_cidrs | default([]) }}"
      when: "'ufw' in ansible_facts.packages"

# Windows twin of the ufw exception: trust the mesh CIDRs wholesale and leave
# per-port control to the DN role firewall, matching the product's model.
- name: Add a firewall exception for dnclient network (Windows)
  ansible.windows.win_shell: |
    $cidrs = @({{ dn_network_cidrs | map('to_json') | join(', ') }})
    if (Get-NetFirewallRule -Name 'dnclient-mesh' -ErrorAction SilentlyContinue) {
      Set-NetFirewallRule -Name 'dnclient-mesh' -RemoteAddress $cidrs
      'present'
    } else {
      New-NetFirewallRule -Name 'dnclient-mesh' -DisplayName 'Defined Networking mesh' `
        -Direction Inbound -Action Allow -RemoteAddress $cidrs | Out-Null
      'created'
    }
  register: dnclient_win_fw_mesh
  changed_when: "'created' in dnclient_win_fw_mesh.stdout"
  when:
    - dnclient_firewall_exception
    - ansible_os_family == 'Windows'
    - dn_network_cidrs | default([]) | length > 0

