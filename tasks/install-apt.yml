---
# Install dnclient from the Defined Networking apt repository.
# https://dl.defined.net/stable/apt   https://dl.defined.net/unstable/apt

# Detect hosts previously set up via the binary install method. `dnclient
# install` (kardianos/service) writes its unit to
# /etc/systemd/system/dnclient.service, which shadows the package's unit in
# /lib/systemd/system. The deb never writes to /etc/systemd/system, so a unit
# file there is unambiguously the legacy one.
- name: Check for a legacy binary-install service unit
  ansible.builtin.stat:
    path: /etc/systemd/system/dnclient.service
  register: dnclient_legacy_unit

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add Defined Networking apt signing key
  ansible.builtin.get_url:
    url: https://dl.defined.net/gpg.asc
    dest: /etc/apt/keyrings/defined-net.asc
    owner: root
    group: root
    mode: '0644'

- name: Set apt repository facts
  ansible.builtin.set_fact:
    dnclient_apt_repos:
      stable: "deb [signed-by=/etc/apt/keyrings/defined-net.asc] https://dl.defined.net/stable/apt stable main"
      unstable: "deb [signed-by=/etc/apt/keyrings/defined-net.asc] https://dl.defined.net/unstable/apt unstable main"

- name: Add Defined Networking apt repository
  ansible.builtin.apt_repository:
    repo: "{{ dnclient_apt_repos[dnclient_track] }}"
    filename: defined-net
    state: present
    update_cache: yes

# apt_repository appends to defined-net.list rather than rewriting it, so
# without this the old track's line survives a switch. Both repositories would
# then be enabled and apt would follow whichever offers the higher version,
# making a switch back to stable silently do nothing.
- name: Remove the inactive Defined Networking apt repository
  ansible.builtin.apt_repository:
    repo: "{{ dnclient_apt_repos[dnclient_inactive_track] }}"
    filename: defined-net
    state: absent
    update_cache: yes

- name: Query the dnclient versions offered by the repository
  # apt-cache policy's Candidate reports the *installed* version when it is
  # higher than anything on offer, which would hide the downgrade needed to
  # return to stable. madison lists only what the repository actually carries,
  # highest version first.
  ansible.builtin.command: apt-cache madison dnclient
  register: dnclient_apt_madison
  changed_when: false
  # Read-only, and the tasks below depend on its output — without this a
  # --check run skips it and leaves dnclient_apt_version undefined.
  check_mode: false

- name: Determine the dnclient version to install
  ansible.builtin.set_fact:
    # Inline if/else rather than the default() filter, which would eagerly
    # evaluate the madison fallback and blow up on an empty result even when a
    # version is pinned.
    dnclient_apt_version: "{{ dnclient_version if dnclient_version is defined else (dnclient_apt_madison.stdout_lines | first).split('|')[1] | trim }}"
  when: dnclient_version is defined or dnclient_apt_madison.stdout_lines | length > 0

- name: Fail when the repository offers no dnclient package
  ansible.builtin.fail:
    msg: >-
      No dnclient package found in the {{ dnclient_track }} apt repository for
      {{ ansible_architecture }}.
  when: dnclient_apt_version is not defined

# Installed while the legacy unit (if any) is still active. The two units use
# different binaries/paths and coexist; the legacy /etc unit keeps shadowing the
# packaged /lib unit, so the running dnclient is NOT disturbed by the install.
# This is critical for hosts reached over their own dnclient link — there must
# be no window where the service is stopped between Ansible tasks.
#
# Pinned to an exact version with allow_downgrade rather than state: latest, so
# switching from unstable back to stable actually moves the host down instead
# of stranding it on the pre-release it already has.
- name: Install dnclient
  ansible.builtin.apt:
    name: "dnclient={{ dnclient_apt_version }}"
    allow_downgrade: yes
    update_cache: yes

- name: Finalize dnclient package install
  ansible.builtin.include_tasks: finalize-package.yml
