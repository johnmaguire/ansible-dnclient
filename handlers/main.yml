---
# Handlers run in the order defined here, so this precedes the restart below —
# a change to the unit drop-in (see custom-binary.yml) is inert until reloaded.
- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: yes
  when: ansible_service_mgr | default('') == 'systemd'
  listen: "restart dnclient"

# Restarting dnclient severs the very connection Ansible may be using to reach
# the host (any host reached over its own Nebula link — e.g. a host addressed by
# its dnclient IP). Doing stop and start as separate tasks strands such a host:
# the stop kills the connection before Ansible can deliver the start.
#
# Instead, launch the restart detached (nohup + &) so it completes on the host
# regardless of the connection dropping, then wait for Ansible to reconnect once
# the tunnel is back. On hosts whose control path is independent of their own
# dnclient (e.g. Incus instances reached via the hypervisor), the wait returns
# immediately since nothing dropped.
#
# systemd hosts go through the service manager: package-managed builds are
# compiled without the stop/start sub-commands, and the unit is what carries
# any drop-in overriding the binary it runs.
- name: Restart dnclient (systemd)
  ansible.builtin.shell: "nohup sh -c 'systemctl restart dnclient' >/dev/null 2>&1 &"
  when: ansible_service_mgr | default('') == 'systemd'
  listen: "restart dnclient"

- name: Restart dnclient (other)
  ansible.builtin.shell: "nohup sh -c '{{ dnclient_bin }} stop && {{ dnclient_bin }} start' >/dev/null 2>&1 &"
  when:
    - ansible_os_family != 'Windows'
    - ansible_service_mgr | default('') != 'systemd'
  listen: "restart dnclient"

# Windows twin of the detached restart: fire-and-forget async survives the
# WinRM connection dropping when the host's own tunnel goes down with the
# service; the reconnect wait below picks the play back up.
- name: Restart dnclient (Windows)
  ansible.windows.win_shell: Restart-Service dnclient
  async: 60
  poll: 0
  when: ansible_os_family == 'Windows'
  listen: "restart dnclient"

- name: Wait for dnclient connection to recover
  ansible.builtin.wait_for_connection:
    delay: 2
    timeout: 90
  listen: "restart dnclient"
